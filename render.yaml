services:
  - type: web
    name: barrister-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m prisma py fetch && python -m prisma generate
    startCommand: python -m prisma py fetch && python -m prisma db push --skip-generate --accept-data-loss && python app/main.py
    envVars:
      - key: PRISMA_BINARY_CACHE_DIR
        value: /opt/render/project/src/.prisma-binaries
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PORT
        value: "10000"
    healthCheckPath: /health
